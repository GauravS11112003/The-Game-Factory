<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Studio runtime dev</title>
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      body { margin: 0; }
      #app { max-width: 1400px; margin: 0 auto; padding: 12px 16px 40px; }
      .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 8px 0 12px; }
      .bar select, .bar button { width: auto; }
      .bar label { display: inline-flex; gap: 6px; align-items: center; }
      #stage { width: 100%; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; background: #ddd; box-shadow: 0 6px 30px rgba(0,0,0,.15); }
      .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 14px; }
      pre, #log { font: 12px/1.4 ui-monospace, Menlo, monospace; background: #fff; border-radius: 10px; padding: 10px; max-height: 240px; overflow: auto; margin: 0; }
      #log { list-style: none; }
      #gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; margin-top: 18px; }
      #gallery figure { margin: 0; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
      #gallery canvas { display: block; width: 100%; height: auto; }
      #gallery figcaption { padding: 6px 10px; font-family: var(--hand); font-size: 1.1rem; }
      kbd { background: #fff; border: 1px solid #ccc; border-radius: 4px; padding: 0 5px; }
      @media (max-width: 800px) { .cols { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div id="app">
      <h1>Studio runtime dev</h1>
      <div class="bar">
        <select id="tpl" aria-label="template"></select>
        <select id="theme" aria-label="theme"><option value="">template theme</option></select>
        <label><input type="checkbox" id="p2" style="width:auto" /> 2 players</label>
        <label><input type="checkbox" id="muted" style="width:auto" /> muted</label>
        <button id="restart" type="button">Restart</button>
        <button id="pause" type="button">Pause</button>
        <button id="remount" type="button">Remount</button>
        <button id="gal" type="button">Theme gallery</button>
      </div>
      <p class="muted small" id="help"></p>
      <div id="stage"></div>
      <div class="cols">
        <div><h3>Events</h3><ul id="log"></ul></div>
        <div><h3>Counters</h3><pre id="counters"></pre></div>
      </div>
      <div id="gallery"></div>
    </div>
    <script type="module" src="/src/studio/dev/main.ts"></script>
  </body>
</html>
