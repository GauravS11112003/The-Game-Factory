[project]
name = "draw-a-level-vision"
version = "0.1.0"
description = "Draw-a-Level vision service: template generator, CV pipeline, vision-model interpretation, FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "opencv-contrib-python",
    "numpy",
    "pillow",
    "qrcode[pil]",
    "sqlmodel",
    "anthropic",
    "jsonschema",
    "pydantic>=2",
    "pytest",
    "authlib>=1.8.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
